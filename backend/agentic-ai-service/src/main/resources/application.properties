spring.application.name=agentic-ai-service

server.port=8087

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3:latest
spring.ai.ollama.chat.options.temperature=0.7

# ================================
# Kafka Configuration
# ================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=skillbridge-agentic-ai-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=agentic_ai.event.AssessmentCompletedEvent

# Kafka long-running AI workflow settings
spring.kafka.consumer.properties.max.poll.interval.ms=1200000
spring.kafka.consumer.properties.max.poll.records=1

# Service-to-service authentication
skillbridge.internal-token=SkillBridgeAI-Internal-2026-9fK7xP2mQ8vL