spring.application.name=api-gateway
server.port=8080

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info

# ==========================================
# USER SERVICE
# ==========================================
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# ==========================================
# SKILL SERVICE
# ==========================================
spring.cloud.gateway.server.webmvc.routes[1].id=skill-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://SKILL-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/skills/**

